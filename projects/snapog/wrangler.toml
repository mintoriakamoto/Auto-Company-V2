name = "snapog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "placeholder-set-after-wrangler-d1-create"

[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[vars]
ENVIRONMENT = "development"
# Public base URL used for Stripe checkout redirects.
APP_URL = "http://127.0.0.1:8787"
# Stripe Price ids (NOT secret) — create products/prices in the Stripe
# dashboard, then paste their price ids here (or per env below).
STRIPE_PRICE_PRO = ""
STRIPE_PRICE_BUSINESS = ""
LEGAL_ENTITY = ""
LEGAL_EMAIL = ""
LEGAL_JURISDICTION = ""
# Secrets (NEVER committed) — set with:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put AUTH_SECRET

# Named environments do NOT inherit top-level bindings in Wrangler —
# d1_databases, r2_buckets and vars must be redeclared per environment or the
# deployed Worker ships with no DB/OG_CACHE and 500s on every data route.
[env.staging]
name = "snapog-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://snapog-staging.workers.dev"
STRIPE_PRICE_PRO = ""
STRIPE_PRICE_BUSINESS = ""
LEGAL_ENTITY = ""
LEGAL_EMAIL = ""
LEGAL_JURISDICTION = ""
[[env.staging.d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "placeholder-set-after-wrangler-d1-create"
[[env.staging.r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[env.production]
name = "snapog"
[env.production.vars]
ENVIRONMENT = "production"
APP_URL = "https://snapog.dev"
STRIPE_PRICE_PRO = ""
STRIPE_PRICE_BUSINESS = ""
LEGAL_ENTITY = ""
LEGAL_EMAIL = ""
LEGAL_JURISDICTION = ""
[[env.production.d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "placeholder-set-after-wrangler-d1-create"
[[env.production.r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"
