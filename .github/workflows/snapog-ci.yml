name: snapog-ci

# Typecheck + build-validate the SnapOG Worker. Runs on changes under the
# project so a broken deploy config or type error is caught before ship.

on:
  push:
    branches:
      - main
    paths:
      - "projects/snapog/**"
      - ".github/workflows/snapog-ci.yml"
  pull_request:
    paths:
      - "projects/snapog/**"
      - ".github/workflows/snapog-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + Wrangler dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/snapog
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/snapog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Wrangler build (dry-run, default env)
        run: npx wrangler deploy --dry-run --outdir /tmp/snapog-build

      - name: Wrangler build (dry-run, staging env)
        run: npx wrangler deploy --dry-run --env staging --outdir /tmp/snapog-build-staging

      - name: Wrangler build (dry-run, production env)
        run: npx wrangler deploy --dry-run --env production --outdir /tmp/snapog-build-prod
