version: 2
updates:
  # Keep GitHub Actions pinned versions current (security + bugfixes).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # SnapOG Worker dependencies.
  - package-ecosystem: npm
    directory: /projects/snapog
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
